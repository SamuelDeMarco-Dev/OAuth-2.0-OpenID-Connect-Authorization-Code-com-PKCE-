<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Servidor de Autorização</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; color: #1f2933; }
        main { max-width: 420px; margin: 8vh auto; background: #fff; padding: 2rem; border-radius: 12px;
               box-shadow: 0 4px 16px rgba(0,0,0,.08); }
        h1 { font-size: 1.4rem; margin-top: 0; }
        label { display: block; margin: 1rem 0 .3rem; font-weight: 600; }
        input[type=text], input[type=password] { width: 100%; padding: .6rem; border: 1px solid #cbd2d9;
               border-radius: 6px; box-sizing: border-box; }
        button { margin-top: 1.4rem; padding: .7rem 1.2rem; border: 0; border-radius: 6px; cursor: pointer;
               font-weight: 600; background: #1f6feb; color: #fff; }
        button.secondary { background: #e4e7eb; color: #1f2933; }
        .alert { background: #fde8e8; color: #9b1c1c; padding: .7rem; border-radius: 6px; }
        .muted { color: #616e7c; font-size: .9rem; }
        ul.scopes { padding-left: 1.2rem; }
    </style>
</head>
</html>
