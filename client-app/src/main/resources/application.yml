# Aplicação cliente (Relying Party) - https://localhost:8443
spring:
  application:
    name: client-app
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/clientapp;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_instant_jdbc_type: TIMESTAMP
  thymeleaf:
    cache: false

server:
  port: ${APP_PORT:8443}
  ssl:
    enabled: true
    key-store: file:${TLS_KEYSTORE_PATH:secrets/tls/localhost.p12}
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
  servlet:
    session:
      # Só cookie: sem ";jsessionid=" na URL (vazaria o id da sessão em logs/Referer).
      tracking-modes: cookie
      # HttpSession só guarda state/nonce/code_verifier antes do login.
      cookie:
        name: APP_PRELOGIN
        http-only: true
        secure: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

oidc:
  client:
    issuer: ${AS_ISSUER:https://localhost:9443}
    client-id: ${OIDC_CLIENT_ID:app-cybersecurity-33506}
    client-secret: ${OIDC_CLIENT_SECRET:}
    redirect-uri: ${OIDC_REDIRECT_URI:https://localhost:8443/callback}
    scopes: [openid, profile, email]
    accepted-algorithms: [RS256]
    clock-skew: 60s
    http-timeout: 5s
    truststore-path: ${TLS_TRUSTSTORE_PATH:secrets/tls/truststore.p12}
    truststore-password: ${TLS_TRUSTSTORE_PASSWORD:}
    session:
      cookie-name: APP_SID
      idle-timeout: 30m
      absolute-timeout: 8h

logging:
  level:
    br.unoesc.cyber: DEBUG
