<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aplicação Cliente</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; color: #1f2933; }
        main { max-width: 560px; margin: 8vh auto; background: #fff; padding: 2rem; border-radius: 12px;
               box-shadow: 0 4px 16px rgba(0,0,0,.08); }
        .button { display: inline-block; padding: .7rem 1.2rem; border: 0; border-radius: 6px; cursor: pointer;
               font-weight: 600; background: #1f6feb; color: #fff; text-decoration: none; font-size: 1rem; }
        .muted { color: #616e7c; font-size: .9rem; }
    </style>
</head>
<body>
<main>
    <h1>Aplicação Cliente</h1>
    <div th:if="${user}">
        <p>Olá, <strong th:text="${user.fullName}">usuário</strong>
            (<span th:text="${user.userName}">user_name</span>) — perfil <code th:text="${user.role}">role</code>.</p>
        <form method="post" th:action="@{/logout}"><button class="button" type="submit">Sair</button></form>
    </div>
    <div th:unless="${user}">
        <p>Você não está autenticado.</p>
        <a class="button" th:href="@{/login}">Entrar</a>
    </div>
    <p class="muted">Provedor: <code th:text="${issuer}">issuer</code></p>
</main>
</body>
</html>
