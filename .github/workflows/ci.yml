name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: ./mvnw -B verify
      - name: Nenhum segredo versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.p12$|\.pem$|\.key$|\.jks$'; then
            echo "::error::Arquivo de segredo versionado (PDF 1.2)"; exit 1; fi
